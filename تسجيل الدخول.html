<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - شركتنا السياحية</title>
</head>
<body background="10.png" text="#2c2c2c">

    <center>
        <br><br><br>
        <table border="1" cellpadding="20" cellspacing="0" bgcolor="#f8f8f8" width="500">
            <tr>
                <td align="center">
                    <h1><font color="#444444" face="Tahoma">مرحباً بك في شركتنا السياحية</font></h1>
                    <h3><font color="#666666">من فضلك قم بإدخال بياناتك للمتابعة</font></h3>
                    <hr width="80%">
                    
                    <form action="asee.html" method="post">
                        <table border="0" cellpadding="10">
                            <tr>
                                <td align="right"><font face="Tahoma">الاسم الكامل:</font></td>
                                <td><input type="text" name="name" placeholder="أدخل اسمك" required></td>
                            </tr>
                            <tr>
                                <td align="right"><font face="Tahoma">الإيميل أو الهاتف:</font></td>
                                <td><input type="text" name="contact" placeholder="example@mail.com or 77*****" required></td>
                            </tr>
                            <tr>
                                <td colspan="2" align="center">
                                    <input type="submit" value="متابعة" style="padding:10px 20px;">
                                    <input type="reset" value="إلغاء" style="padding:10px 20px;">
                                </td>
                            </tr>
                        </table>
                    </form>
                </td>
            </tr>
        </table>
    </center>

</body>
</html>
